# AI Verkenner — curated source registry
#
# A hand-maintained list of trusted sources. Adding a source is a deliberate editorial act.
# This is a CURATED PIPELINE, not a crawler (see docs/AI_VERKENNER_PROJECT_BRIEF.md §3).
#
# Schema per entry:
#   name:         human-readable label (required)
#   source_type:  rss | github_releases | arxiv                                  (required)
#                 | github_new_repos | github_star_velocity                      (curated GitHub
#                 | github_advisories | github_changes                          #  intelligence,
#                                                                               #  ADR 0002 — M6.5)
#   url:          canonical URL / feed URL           (required; preserved verbatim)
#   repo_owner:   GitHub org/user   (github_releases; github_changes; optional new_repos/velocity)
#   repo_name:    GitHub repo       (github_releases; github_changes; optional advisories/velocity)
#   arxiv_query:  arXiv API query   (arxiv only)
#   github_topic: watched topic     (github_new_repos / github_star_velocity)
#   github_package + github_ecosystem: watched dependency  (github_advisories — Early Warning)
#   github_label: issue/PR label    (github_changes; default "breaking-change")
#   enabled:      true | false                        (required)
#   trust_level:  high | medium | low                 (required)
#
# The github_* intelligence types are sanctioned by ADR 0002 / SIGNATURE_OUTPUTS §4. They stay
# CURATED (watched orgs/users/topics/packages + the official GitHub API), never a broad crawler.
# They require GITHUB_TOKEN; without it they are skipped (degrade, never crash). Implemented in M6.5.
#
# A per-source recency cap (SOURCE_MAX_AGE_DAYS / SOURCE_MAX_ITEMS) bounds archive-serving feeds.
# That cap is also the most common reason a source shows zero rows (task 011 defect 2): a healthy
# feed that publishes less often than the window contributes nothing without being broken. Run
# `python -m app.cli sources --health` before concluding a source is dead — it separates
# `stale-window` (fine) from `no-items` (a URL that does not serve a feed), `error`, and
# `no-token` (a github_* source with no GITHUB_TOKEN — skipped by design).

sources:
  # ---- Frontier labs ----
  - name: OpenAI Blog
    source_type: rss
    url: https://openai.com/blog/rss.xml
    enabled: true
    trust_level: high

  # DISABLED 2026-08-04 (task 011 defect 2 / D-017). The url below is an HTML page, not a feed:
  # it returns HTTP 200 and parses to ZERO entries, so the source looked healthy while
  # contributing nothing. Anthropic publishes no RSS/Atom for /news — probed 2026-08-04 and all
  # 404: /news.rss, /news/feed, /rss.xml, /news/rss.xml, /feed.xml, /atom.xml, /news/index.xml.
  # (status.anthropic.com/history.rss exists but is incident history, a DIFFERENT source — using
  # it here would be a substitution, not a fix.) Re-enable the day a real feed appears.
  - name: Anthropic News
    source_type: rss
    url: https://www.anthropic.com/news
    enabled: false
    trust_level: high

  - name: Google DeepMind Blog
    source_type: rss
    url: https://deepmind.google/blog/rss.xml
    enabled: true
    trust_level: high

  # ---- Platforms & dev tools ----
  - name: GitHub Blog
    source_type: rss
    url: https://github.blog/feed/
    enabled: true
    trust_level: high

  - name: Cursor Changelog
    source_type: rss
    url: https://www.cursor.com/changelog/rss.xml
    enabled: true
    trust_level: medium

  # ---- AI app frameworks ----
  # URL FIXED 2026-08-04 (task 011 defect 2 / D-017). The blog moved to langchain.com and the old
  # blog.langchain.dev/rss/ now 302s to an HTML page — HTTP 200, zero entries, silently no rows.
  # Verified: the url below returns 100 entries.
  - name: LangChain Blog
    source_type: rss
    url: https://www.langchain.com/blog/rss.xml
    enabled: true
    trust_level: medium

  # LlamaIndex's blog RSS 404s; track its releases instead (reliable, same signal source).
  # HEALTHY but low-cadence — D-017 listed it as zero-yield; the audit was verified 2026-08-04 and
  # the cause is NOT this entry: 30 releases fetch fine, the newest (v0.14.23, 2026-06-24) is
  # simply older than SOURCE_MAX_AGE_DAYS. Left enabled deliberately; `sources --health` now
  # reports this as `stale-window`, not as a broken source.
  - name: LlamaIndex Releases
    source_type: github_releases
    url: https://github.com/run-llama/llama_index/releases
    repo_owner: run-llama
    repo_name: llama_index
    enabled: true
    trust_level: medium

  # ---- Data / vector / graph infrastructure ----
  # RETAINED, cadence recorded (task 011 acceptance, D-048/D-050). Named by D-041 as zero-yield and
  # never covered by D-017's list. Verified 2026-08-04: 30 releases fetch fine, newest v1.18.3
  # (2026-07-17) — a normal gap for a release feed, simply older than a 7-day window. Reports
  # `stale-window`, not broken.
  - name: Qdrant Releases
    source_type: github_releases
    url: https://github.com/qdrant/qdrant/releases
    repo_owner: qdrant
    repo_name: qdrant
    enabled: true
    trust_level: high

  # DISABLED 2026-08-04 (task 011 defect 2 / D-017). neo4j/neo4j stopped publishing GitHub
  # Releases in 2017 — verified 2026-08-04: the newest release is 3.3.0-beta01 (2017-09-15), while
  # the repo is actively TAGGED (2026.06.0, 2026.05.0, ...). The github_releases fetcher reads
  # /releases, so this entry can never yield, regardless of the recency window. Re-enabling needs
  # a tags-based fetcher, which no task file calls for.
  - name: Neo4j Releases
    source_type: github_releases
    url: https://github.com/neo4j/neo4j/releases
    repo_owner: neo4j
    repo_name: neo4j
    enabled: false
    trust_level: medium

  # ---- Research (arXiv) ----
  - name: arXiv cs.AI (Artificial Intelligence)
    source_type: arxiv
    url: https://arxiv.org/list/cs.AI/recent
    arxiv_query: cat:cs.AI
    enabled: true
    trust_level: high

  - name: arXiv cs.CL (Computation and Language)
    source_type: arxiv
    url: https://arxiv.org/list/cs.CL/recent
    arxiv_query: cat:cs.CL
    enabled: true
    trust_level: high

  - name: arXiv cs.LG (Machine Learning)
    source_type: arxiv
    url: https://arxiv.org/list/cs.LG/recent
    arxiv_query: cat:cs.LG
    enabled: true
    trust_level: high

  # ---- Independent outlets (cross-publisher overlap → convergence can actually fire, M6.5) ----
  # Reputable AI-covering publishers. Different outlets often cover the same launch, so a real
  # development converges across INDEPENDENT sources. High volume → bounded by the recency cap.
  - name: Ars Technica AI
    source_type: rss
    url: https://arstechnica.com/ai/feed/
    enabled: true
    trust_level: high

  # RETAINED, cadence recorded (task 011 acceptance, D-048/D-050) — but WATCH THIS ONE. Named by
  # D-041 as zero-yield and never covered by D-017's list. Verified 2026-08-04: the feed parses and
  # returns 7 entries, but the newest is dated 2026-05-19 — 2.5 months for a daily publisher, which
  # reads more like a feed that stopped updating than like low cadence. Left enabled because it
  # fetches cleanly and disabling on suspicion would delete coverage; `sources --health` will show
  # it as `stale-window` every run. If it is still frozen at 2026-05-19 by the next review, it is a
  # dead feed and needs a URL fix or a disable.
  - name: VentureBeat AI
    source_type: rss
    url: https://venturebeat.com/category/ai/feed/
    enabled: true
    trust_level: medium

  # Topic-scoped, not site-wide (task 011 defect 1 / D-017): the whole-publication feeds of these
  # three carried every off-topic item in the 266-item audit. Scope lives in the URL, not the
  # classifier.
  - name: MIT Technology Review — AI
    source_type: rss
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed/
    enabled: true
    trust_level: high

  - name: The Register — AI/ML
    source_type: rss
    url: https://www.theregister.com/software/ai_ml/headlines.atom
    enabled: true
    trust_level: medium

  - name: Hacker News (AI/LLM, ≥100 points)
    source_type: rss
    url: https://hnrss.org/newest?q=AI+OR+LLM+OR+GPT+OR+%22machine+learning%22&points=100
    enabled: true
    trust_level: low

  # ---- Practitioners / individuals ----
  - name: Simon Willison's Weblog
    source_type: rss
    url: https://simonwillison.net/atom/everything/
    enabled: true
    trust_level: high

  # HEALTHY but low-cadence — same finding as LlamaIndex Releases (task 011 defect 2, verified
  # 2026-08-04): the feed serves 212 entries, the newest dated 2026-06-21, all outside the recency
  # window. Not a broken source; left enabled and reported as `stale-window`.
  - name: Eugene Yan
    source_type: rss
    url: https://eugeneyan.com/rss/
    enabled: true
    trust_level: high

  # ---- Backend / frontend tooling the stack depends on ----
  - name: FastAPI Releases
    source_type: github_releases
    url: https://github.com/fastapi/fastapi/releases
    repo_owner: fastapi
    repo_name: fastapi
    enabled: true
    trust_level: high

  - name: Vite Releases
    source_type: github_releases
    url: https://github.com/vitejs/vite/releases
    repo_owner: vitejs
    repo_name: vite
    enabled: true
    trust_level: high

  # ---- Curated GitHub intelligence (ADR 0002) — implemented in M6.5; require GITHUB_TOKEN ----
  # Watched orgs/users/topics/packages via the official API — NOT a crawler. Skipped (not failed)
  # when GITHUB_TOKEN is absent.
  - name: New repos under topic:llm
    source_type: github_new_repos
    url: https://github.com/topics/llm
    github_topic: llm
    enabled: true
    trust_level: medium

  - name: New repos under topic:rag
    source_type: github_new_repos
    url: https://github.com/topics/rag
    github_topic: rag
    enabled: true
    trust_level: medium

  - name: Star velocity under topic:llm
    source_type: github_star_velocity
    url: https://github.com/topics/llm
    github_topic: llm
    enabled: true
    trust_level: medium

  - name: Star velocity under topic:agents
    source_type: github_star_velocity
    url: https://github.com/topics/agents
    github_topic: agents
    enabled: true
    trust_level: medium

  - name: Advisories — fastapi (own stack)
    source_type: github_advisories
    url: https://github.com/advisories?query=affects%3Afastapi
    github_package: fastapi
    github_ecosystem: pip
    enabled: true
    trust_level: high

  - name: Advisories — langchain (own stack)
    source_type: github_advisories
    url: https://github.com/advisories?query=affects%3Alangchain
    github_package: langchain
    github_ecosystem: pip
    enabled: true
    trust_level: high

  - name: Breaking changes — langchain-ai/langchain
    source_type: github_changes
    url: https://github.com/langchain-ai/langchain/issues
    repo_owner: langchain-ai
    repo_name: langchain
    github_label: "breaking change"
    enabled: true
    trust_level: high
